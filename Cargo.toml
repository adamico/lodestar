[workspace]
resolver = "3"
members = ["crates/lodestar-core", "crates/lodestar"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
lodestar-core = { path = "crates/lodestar-core" }
# Pinned to an exact version on purpose: GPUI breaks its API often (ADR 0001).
gpui-kit = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
